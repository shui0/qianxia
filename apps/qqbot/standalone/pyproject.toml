[project]
name = "qianxia-standalone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.4,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "httpx>=0.27,<1",
    "bilibili-api-python>=17.4,<18",
    "Pillow>=10",
    "ddgs>=9.16,<10",
]

[tool.nonebot]
plugin_dirs = ["plugins"]
[tool.nonebot.plugins]

[tool.nonebot.adapters]
"nonebot-adapter-onebot" = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]

[tool.setuptools]
packages = []
